<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watech Engineering (UPJN) LLP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
 --bg:#fff; --text:#000; --blue:#004aad;
}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}
.dark{--bg:#111;--text:#fff;}
.topbar{background:#000;color:#fff;font-size:13px;padding:5px 10px;display:flex;justify-content:space-between}
.topbar a{color:#fff;margin:0 5px;text-decoration:none}
header{background:var(--blue);color:#fff;padding:10px;display:flex;align-items:center}
header img{height:60px;margin-right:10px}
nav{background:#003380;}
nav ul{list-style:none;margin:0;padding:0;display:flex}
nav li{position:relative}
nav a{color:#fff;padding:10px 15px;display:block;text-decoration:none}
nav li:hover>ul{display:block}
nav ul ul{display:none;position:absolute;background:#004aad;top:100%;left:0;min-width:180px}
nav ul ul li{width:100%}
.container{display:flex}
.left{width:220px;background:#eee;padding:10px}
.main{flex:1;padding:20px}
.slider img{width:100%;height:300px;object-fit:cover}
.card{background:#f2f2f2;padding:15px;margin:10px 0;border-radius:5px}
footer{background:#003380;color:#fff;text-align:center;padding:10px}
</style>
</head>

<body>
<div class="topbar">
<div>
<a href="#">Skip to Main</a> |
<a href="#">Screen Reader</a> |
<a href="#">Sitemap</a>
</div>
<div>
<button onclick="font(1)">A+</button>
<button onclick="font(-1)">A-</button>
<button onclick="theme()">Theme</button>
<button onclick="lang('hi')">हिंदी</button>
<button onclick="lang('en')">English</button>
</div>
</div>

<header>
<img src="logo.png">
<h2 id="title">Watech Engineering (UPJN) LLP</h2>
</header>

<nav>
<ul>
<li><a href="#" data-key="home">Home</a></li>
<li><a href="#" data-key="about">About</a>
<ul>
<li><a href="#">Vision</a></li>
<li><a href="#">Mission</a></li>
</ul>
</li>
<li><a href="#">Services</a></li>
<li><a href="#">Tenders</a></li>
<li><a href="#" data-key="contact">Contact</a></li>
</ul>
</nav>

<div class="container">
<div class="left">
<b>Quick Links</b>
<ul>
<li>Projects</li>
<li>Downloads</li>
<li>Notices</li>
</ul>
</div>

<div class="main">
<div class="slider">
<img src="slide1.jpg">
</div>

<div class="card">
<h3 data-key="about">About Us</h3>
<p id="about"></p>
</div>

<div class="card">
<h3 data-key="vision">Vision</h3>
<p id="vision"></p>
</div>

<div class="card">
<h3 data-key="mission">Mission</h3>
<p id="mission"></p>
</div>

<div class="card">
<h3 data-key="contact">Contact</h3>
<p id="contact"></p>
</div>
</div>
</div>

<footer>
© 2026 Watech Engineering (UPJN) LLP
</footer>

<script>
let size=16;
function font(x){size+=x;document.body.style.fontSize=size+"px";}
function theme(){document.body.classList.toggle("dark");}

const LANG={
en:{
title:"Watech Engineering (UPJN) LLP",
about:"Watech Engineering is a professional consultancy in water & infrastructure.",
vision:"To be a trusted engineering partner.",
mission:"Deliver quality and sustainable solutions.",
contact:"Email: watechengineering@gmail.com | Phone: 9559222140",
home:"Home"
},
hi:{
title:"वाटेक इंजीनियरिंग (UPJN) LLP",
about:"वाटेक इंजीनियरिंग जल एवं इंफ्रास्ट्रक्चर की प्रोफेशनल कंसल्टेंसी है।",
vision:"एक भरोसेमंद इंजीनियरिंग पार्टनर बनना।",
mission:"गुणवत्ता एवं टिकाऊ समाधान देना।",
contact:"ईमेल: watechengineering@gmail.com | फोन: 9559222140",
home:"मुख्य पृष्ठ"
}
};

function lang(l){
document.getElementById("title").innerText=LANG[l].title;
about.innerText=LANG[l].about;
vision.innerText=LANG[l].vision;
mission.innerText=LANG[l].mission;
contact.innerText=LANG[l].contact;
document.querySelectorAll("[data-key]").forEach(e=>{
e.innerText=LANG[l][e.dataset.key];
});
}
lang("en");
</script>
</body>
</html>
